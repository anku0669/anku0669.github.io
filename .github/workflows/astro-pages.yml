name: Build and deploy Climate Shock Lab
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site-src/package.json
      - name: Install Astro, Tailwind and animation dependencies
        run: npm install --prefix site-src --no-audit --no-fund
      - name: Build static site
        run: npm run build --prefix site-src
      - name: Assemble profile site and updated observatory
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='site-src' --exclude='_site' --exclude='node_modules' ./ _site/
          cp -a site-src/dist/. _site/
          test -f _site/index.html
          test -f _site/climate-risk-observatory/index.html
          test -f _site/climate-risk-observatory/studio.html
          test -f _site/climate-risk-observatory/assets/js/simulator.js
          echo "Root portfolio and observatory pages staged."
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
