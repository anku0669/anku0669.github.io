name: Build and deploy Climate Shock Lab
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/astro-pages.yml'
      - 'site-src/**'
      - 'climate-risk-observatory/*.html'
      - 'climate-risk-observatory/*.md'
      - 'climate-risk-observatory/assets/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site-src/package.json
      - name: Install Astro, Tailwind and animation dependencies
        run: npm install --prefix site-src --no-audit --no-fund
      - name: Build static site
        run: npm run build --prefix site-src
      - name: Sync generated homepage for branch-publishing fallback
        run: |
          rm -rf _astro
          mkdir -p _astro
          cp -a site-src/dist/_astro/. _astro/
          cp site-src/dist/climate-risk-observatory/index.html climate-risk-observatory/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- climate-risk-observatory/index.html _astro
          if git diff --cached --quiet; then
            echo "Generated homepage is already up to date."
          else
            git commit -m "Build Astro observatory homepage [skip ci]"
            git push origin HEAD:main
          fi
      - name: Assemble profile site and updated observatory
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='site-src' --exclude='_site' --exclude='node_modules' ./ _site/
          cp -a site-src/dist/. _site/
          test -f _site/.nojekyll
          test -f _site/climate-risk-observatory/index.html
          test -f _site/climate-risk-observatory/studio.html
          test -f _site/climate-risk-observatory/assets/js/simulator.js
          test -d _site/_astro
          echo "Root files, generated Astro homepage, and existing observatory pages staged."
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Let the repository's branch publisher finish first
        run: sleep 60
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
